name: Build WorkDroid Next

on:
  push:
    branches:
      - workdroid-android-v0.1
    paths:
      - 'android/**'
      - '.github/workflows/build-workdroid-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WorkDroid-Next-v1.1.0-alpha2.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkDroid-Next-v1.1.0-alpha2
          path: WorkDroid-Next-v1.1.0-alpha2.apk

      - name: Publish prerelease APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: workdroid-next-v1.1.0-alpha2
          name: WorkDroid Next v1.1.0 alpha 2
          prerelease: true
          make_latest: false
          files: WorkDroid-Next-v1.1.0-alpha2.apk
