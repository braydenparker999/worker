name: WorkDroid Relay CI

on:
  push:
    branches:
      - workdroid-relay-v0.1
    paths:
      - "workdroid/**"
      - ".github/workflows/workdroid-relay.yml"
  pull_request:
    paths:
      - "workdroid/**"
      - ".github/workflows/workdroid-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workdroid-relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workdroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workdroid/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/workdroid-dist
