name: One-time WorkDroid Wrangler deploy

on:
  push:
    branches:
      - workdroid-relay-v0.1
    paths:
      - ".github/workflows/workdroid-relay-device-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workdroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workdroid/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Start Wrangler device authorization
        run: |
          nohup script -q -e -c "npx wrangler login --device" /tmp/wrangler-device.log >/tmp/wrangler-device.out 2>&1 &
          echo $! >/tmp/wrangler-device.pid
          for attempt in {1..20}; do
            if grep -q "enter the code" /tmp/wrangler-device.out; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler-device.out
          exit 1
      - name: Publish one-time approval code
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-device-code
          path: /tmp/wrangler-device.out
          retention-days: 1
      - name: Wait for Cloudflare approval
        run: timeout 330 tail --pid="$(cat /tmp/wrangler-device.pid)" -f /dev/null
      - name: Deploy WorkDroid relay
        run: npx wrangler deploy
