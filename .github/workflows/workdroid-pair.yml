name: One-time WorkDroid secure pairing

on:
  push:
    branches:
      - workdroid-relay-v0.1
    paths:
      - ".github/workflows/workdroid-pair.yml"

permissions:
  contents: write

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workdroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workdroid/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Authorize Wrangler and rotate pairing token
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_PATH: .workdroid/wrangler-pair-code.txt
          PAIRING_PUBLIC_KEY_B64: ""
        run: |
          set -euo pipefail
          script -q -e -c "npx wrangler login --device" /tmp/wrangler-device.log >/tmp/wrangler-device.out 2>&1 &
          login_pid=$!

          cleanup() {
            if [[ -f /tmp/code-file-sha ]]; then
              file_sha="$(cat /tmp/code-file-sha)"
              jq -n --arg message "Remove expired Wrangler pairing code" --arg sha "$file_sha" --arg branch "$GITHUB_REF_NAME" '{message:$message,sha:$sha,branch:$branch}' >/tmp/delete-code.json
              curl -fsS -X DELETE -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$CODE_PATH" --data-binary @/tmp/delete-code.json >/dev/null || true
            fi
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if grep -q "enter the code" /tmp/wrangler-device.out; then break; fi
            if ! kill -0 "$login_pid" 2>/dev/null; then cat /tmp/wrangler-device.out; exit 1; fi
            sleep 1
          done

          device_code="$(sed -n '/enter the code:/,/You have/p' /tmp/wrangler-device.out | grep -Eo '[A-Za-z0-9]{8}' | tail -1)"
          test -n "$device_code"
          printf 'https://dash.cloudflare.com/oauth2/device/verify?user_code=%s\n%s\n' "$device_code" "$device_code" >/tmp/pair-code.txt
          encoded="$(base64 -w0 /tmp/pair-code.txt)"
          jq -n --arg message "Publish active Wrangler pairing code" --arg content "$encoded" --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' >/tmp/create-code.json
          curl -fsS -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$CODE_PATH" --data-binary @/tmp/create-code.json | jq -r '.content.sha' >/tmp/code-file-sha

          wait "$login_pid"
          cleanup
          rm -f /tmp/code-file-sha
          trap - EXIT

          openssl rand -hex 32 >/tmp/device-token.txt
          printf '%s' "$(cat /tmp/device-token.txt)" | npx wrangler secret put DEVICE_TOKEN
          printf '%s' "$PAIRING_PUBLIC_KEY_B64" | base64 -d >/tmp/pairing-public.pem
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pairing-public.pem -in /tmp/device-token.txt -out /tmp/device-token.enc
      - name: Preserve encrypted pairing token
        uses: actions/upload-artifact@v4
        with:
          name: workdroid-pairing-token
          path: /tmp/device-token.enc
          retention-days: 1
      - name: Deploy WorkDroid relay
        run: npx wrangler deploy
